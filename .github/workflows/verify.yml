name: Verify

# Every check that must pass before a change reaches Pages. Runs on pull
# requests so a broken change shows a red check *before* merge, and is
# called by deploy.yml so main is held to the same gate (#330).

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload build/ as the Pages artifact (deploy only).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        # postinstall (scripts/setup-static.mjs) creates symlinks from
        # static/<entity> to data-repo/data/<entity>. adapter-static
        # follows symlinks at build time and writes real files to build/.

      # First, and before anything that could write data: the committed data
      # files must already be canonical (RFC #45). This never rewrites them.
      - name: Data format
        run: npm run data-format

      # Tablets/pens are generated from data-repo/source (DrawTabData#45).
      # Check the COMMITTED bundles match before the build (whose Vite plugin
      # regenerates) could quietly fix a stale one.
      - name: Generated bundles match their sources
        run: npm run data-generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx svelte-kit sync && npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Data quality
        run: npm run data-quality

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # The build's own version.json must verify: its bundles hash as
      # recorded and regenerate byte-for-byte from the data commit it names
      # (RFC #45). So every deploy is a snapshot outsiders can check.
      - name: Published snapshot verifies
        run: npm run verify-snapshot -- build/version.json

      # Packs data-repo and queriton as npm would publish them and imports
      # them from a throwaway project. Needs the npm registry (it installs
      # tsx), so it's its own step: a registry hiccup shows here, not as a
      # data failure.
      - name: Package smoke test (network)
        run: npm run pack-smoke

      - name: Upload Pages artifact
        if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  # Line endings are the one thing the Linux job can't catch: a Windows
  # checkout with core.autocrlf=true (the runner default) used to turn data
  # files CRLF. data-repo/.gitattributes forces LF; this proves it on a real
  # Windows clone and runs the byte-exact format check there.
  data-format-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Data files are checked out LF
        shell: bash
        working-directory: data-repo
        run: |
          echo "core.autocrlf=$(git config --get core.autocrlf || echo unset)"
          bad=$(git ls-files --eol -- '*.json' | grep -v "i/lf.*w/lf" || true)
          if [ -n "$bad" ]; then echo "Not LF:"; echo "$bad"; exit 1; fi

      # These scripts only import node: builtins and data-repo/lib, so tsx
      # is all they need.
      - name: Data format
        run: npx --yes tsx data-repo/scripts/format-data.ts

      - name: Generated bundles match their sources
        run: npx --yes tsx data-repo/scripts/generate.ts
